# SegueIT Projects — run everything with one command:
#
#   docker compose up --build
#
# Then open http://localhost:3000 and sign in with the root admin defined in
# apps/api/prisma/seed-data.ts (ROOT_ACCOUNT); change its password after the first sign-in.
# For local development without Docker for the app itself: `docker compose up -d db`.
#
# Settings below can be overridden from your shell or a `.env` file next to this one,
# e.g. SEED_DEMO_DATA=true docker compose up --build

name: segueit-projects

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: segueit
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d segueit']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-SegueIT Projects}
      # Set to true when the site is served over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      # Defaults to the bundled database; point both at Supabase to use it instead.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/segueit?schema=public}
      DIRECT_URL: ${DIRECT_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/segueit?schema=public}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ROOT_EMAIL: ${ROOT_EMAIL:-}
      ROOT_PASSWORD: ${ROOT_PASSWORD:-}
      # Leave empty to auto-generate and store them in the data volume.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      # Hour (organization time zone) when everyone is told about that day's meetings.
      MEETING_DIGEST_HOUR: ${MEETING_DIGEST_HOUR:-8}
      # true adds a demo organization with sample users and projects (see prisma/seed-data.ts).
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    volumes:
      - api-data:/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_APP_NAME: ${APP_NAME:-SegueIT Projects}
        NEXT_PUBLIC_BRAND_COLOR: ${BRAND_COLOR:-#0b5cad}
        API_PROXY_TARGET: http://api:4000/api
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
  db-data:
